[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "tixl-python-wrapper"
version = "0.1.0"
description = "Pythonic library for building and capturing TiXL patches."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "typer==0.28.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
tixl-ascii = "tixl_python.cli:run"
tixl-python = "tixl_python.cli:run"
tixl-api = "tixl_python.api.cli:run"

[dependency-groups]
dev = [
    "ipdb==0.13.13",
    "ipython==9.18.1",
    "prek==0.5.10",
    # Having ruff in the venv helps with IDE's auto lint/format integrations
    "ruff==0.17.3"
]

[tool.hatch.build]
targets.wheel.packages = [ "src/tixl_python" ]
