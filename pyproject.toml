[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "pytixl"
description = "Pythonic library for building and capturing TiXL patches."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dynamic = [ "version" ]
dependencies = [
    # [standard] allows to use "fastapi run" commands
    # No 3.15 support, pushing for the latest release for now.
    "fastapi[standard]>=0.162.2",
    # Earliest version with Python 3.15 support
    "pydantic>=2.14.0",
    # No 3.15 support, pushing for the latest release for now.
    "typer==0.29.0",
    # No 3.15 support, pushing for the latest release for now.
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pytixl-ascii = "pytixl.cli:run"
pytixl = "pytixl.cli:run"
pytixl-api = "pytixl.api.cli:run"

[dependency-groups]
# Using latest versions for all dev dependencies.
dev = [
    "ipdb==0.13.13",
    "ipython==9.18.1",
    "prek==0.5.10",
    # Having ruff in the venv helps with IDE's auto lint/format integrations
    "ruff==0.17.3"
]

[tool.hatch.version]
path = "src/pytixl/__init__.py"

[tool.hatch.build]
targets.wheel.packages = [ "src/pytixl" ]
